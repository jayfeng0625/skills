merge_guidance: |
  Claude Code port. Role lines come from ~/.claude/pstack-models.md; a role value is `<model> <effort>`, spawned as type `pstack-<effort>` with `model` (see setup-pstack).
  `why investigators` and `why synthesizer` default to `claude-opus-5-5 high`. MCP discovery reads `mcp__<server>__<tool>` names
  from the session's tools, in place of Cursor's tools map and `mcps/` directory. Upstream's
  `readonly: false` notes became "the `pstack-<effort>` type carries MCP tools" (it omits `tools`); Claude
  Code's read-only agent types keep MCP tools, so the Cursor warning about Ask mode does not
  carry over. "cursor location" on line 25 means the editor cursor and stays.
