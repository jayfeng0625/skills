  `create-skill` became Anthropic's `skill-creator` (here and in references/synthesizer.md).
  In the three reviewer references, skill-use evidence names `Skill` tool calls, Claude Code
  skill paths, `Agent` prompts, and Bash for Cursor's Shell. The Bugbot and gpt-4 lines in
  synthesizer.md are example text and stay.
