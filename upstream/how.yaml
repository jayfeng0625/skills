merge_guidance: |
  Claude Code port. Role lines come from ~/.claude/pstack-models.md; a role value is `<model> <effort>`, spawned as type `pstack-<effort>` with `model` (see setup-pstack).
  `how explorer` defaults to `claude-opus-5-5 medium`, `how explainer` to `claude-opus-5-5 high` (the user's choice); `inherit` replaces `auto` and `inherit-parent`; a rejected default falls back to
  `inherit`. Task became the Agent tool, `generalPurpose` became the `pstack-<effort>` type, and
  `readonly: true` became a brief that says the subagent edits no files.
