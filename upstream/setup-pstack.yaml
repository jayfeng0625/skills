merge_guidance: |
  Claude Code port. The model file is ~/.claude/pstack-models.md: plain Markdown, no
  frontmatter, outside ~/.claude/rules/ so it costs context only when a pstack skill reads it.
  A role value is one Agent tool `model` value; `inherit` replaces `auto` and `inherit-parent`.
  The Agent tool's `model` accepts only `sonnet`, `opus`, `haiku`, and `fable`, and rejects a
  full ID such as `claude-opus-5-5` (tested 2026-10-04), so defaults name `opus` and `fable`.
  Upstream encodes effort in Cursor model slugs (`claude-opus-5-5-max`). The Agent tool takes
  no effort per call, and subagents without `effort` frontmatter run at the session's effort
  (tested 2026-10-04), so role values carry no effort and the budget step stays dropped (the
  user's choice, after per-effort subagent copies proved more machinery than they earned).
  The user's defaults (2026-10-04): `opus` for every role except `hardest tasks: fable`,
  `architect runners: fable`, and `interrogate reviewers: opus, fable` (`how explorer` was
  sonnet). Arena and architect runner counts come from design directions. Map any new upstream
  role to the closest default and keep its label verbatim.
  Step 6 installs pstack's subagents (shipped in no-comments/ and poteto-mode/ under
  subagents/) into ~/.claude/agents/ with the Write tool. Symlinks were rejected: the user's
  hook blocks Bash writes under ~/.claude. Add a line there for any new upstream agent.
