merge_guidance: |
  Claude Code port. The model file is ~/.claude/pstack-models.md: plain Markdown, no
  frontmatter, outside ~/.claude/rules/ so it costs context only when a pstack skill reads it.
  Role values are Agent tool `model` values; `inherit` replaces `auto` and `inherit-parent`.
  The user's defaults: opus everywhere, `hardest tasks: fable`, sonnet only for `how explorer`,
  `interrogate reviewers: opus, fable`. Arena and architect runner lines name models only;
  the runner count comes from design directions.
  The budget step is dropped: the Agent tool takes no reasoning effort per call. Map any
  new upstream role to these defaults and keep its label verbatim.
  Step 6 installs pstack's subagents (shipped in no-comments/ and poteto-mode/ under
  subagents/) into ~/.claude/agents/ with the Write tool. Symlinks were rejected: the user's
  hook blocks Bash writes under ~/.claude. Add a line there for any new upstream agent.
