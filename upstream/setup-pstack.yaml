merge_guidance: |
  Claude Code port. The model file is ~/.claude/pstack-models.md: plain Markdown, no
  frontmatter, outside ~/.claude/rules/ so it costs context only when a pstack skill reads it.
  A role entry is `<model> [effort]`: one Agent tool `model` value and an optional `effort`
  value; `inherit` replaces `auto` and `inherit-parent`.
  The Agent tool's `model` accepts only `sonnet`, `opus`, `haiku`, and `fable`, and rejects a
  full ID such as `claude-opus-5-5` (tested 2026-10-04), so defaults name `opus` and `fable`.
  Upstream encodes effort in Cursor model slugs (`claude-opus-5-5-xhigh`); here the effort is
  the entry's second word. The Agent tool takes `effort` per call (2026-10-07: a spawn with
  `effort: low` recorded `perTurnEffort: low` for general-purpose, poteto-agent, and
  comment-sicko; this replaces a 2026-10-04 note that it took none). Per-call `model` and
  `effort` override agent frontmatter, and frontmatter applies when the call passes neither
  (tested 2026-10-07 on comment-sicko). An entry with no effort runs at the session's effort.
  Upstream's global budget step stays dropped (the user's choice, 2026-10-07): each entry
  carries its own effort.
  The user's defaults (2026-10-07) are the step 5 shape. Arena and architect runner counts
  come from design directions. Map any new upstream role to the closest default and keep its
  label verbatim.
  Step 6 installs pstack's subagents (shipped in no-comments/ and poteto-mode/ under
  subagents/) into ~/.claude/agents/ with the Write tool. Symlinks were rejected: the user's
  hook blocks Bash writes under ~/.claude. Add a line there for any new upstream agent.
