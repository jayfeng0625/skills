merge_guidance: |
  Claude Code port. Pinned past the other pstack skills (e43c7ee) because poteto-help first
  landed upstream in 4e5b1cf, after that commit.
  Public links go to github.com/jayfeng0625/skills/blob/main/skills/. The model file is
  ~/.claude/pstack-models.md, roles use `inherit` for `auto`/`inherit-parent`, and the
  reasoning-budget question is dropped (setup-pstack here sets a model and effort per entry,
  with no global budget).
  Cursor-only material is dropped: /add-plugin and Customize install (became
  `npx skills add jayfeng0625/skills`), Custom Modes and Enter vs Option+Enter (became how
  a typed skill stays in the conversation, and the cost of retyping /poteto-mode), the
  "built for Cursor" paragraph, Cursor's own babysit skill, cloud agents (swarm runs
  background subagents), and the docs/guide and README links, which this repo does not ship.
  Plan Mode became Claude Code's plan mode; /loop is Claude Code's; /create-skill became
  Anthropic's skill-creator; deslop, control-cli, and control-ui install from this repo.
  The make-bot-ui row is dropped (not ported). "Only /setup-pstack loads from the user's
  words" lists every routed skill here without disable-model-invocation: setup-pstack, tdd,
  and deslop. Recheck that list on each merge.
  The principles paragraph says to steer with names under /poteto-mode, and to type
  /principle-<name> outside it.
